# ShreeRam CRM — paste into HTTPS server block of aweliontech.com
# IMPORTANT: DELETE any older /shreeram-crm/ UI locations first.
# Keep only these ShreeRam blocks (+ your unrelated site locations).

# API
location ^~ /shreeram-crm/api/ {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME /var/www/shreeram-crm/backend/public/index.php;
    fastcgi_param SCRIPT_NAME /shreeram-crm/index.php;
    fastcgi_param REQUEST_URI $request_uri;
    add_header Cache-Control "no-store" always;
}

location = /shreeram-crm/api {
    return 301 /shreeram-crm/api/;
}

# Force old UI URLs to v3
location = /shreeram-crm {
    return 302 /shreeram-crm/v3/;
}
location = /shreeram-crm/ {
    return 302 /shreeram-crm/v3/;
}
location ^~ /shreeram-crm/v2/ {
    return 302 /shreeram-crm/v3/;
}

# New UI (MUST be more specific than any /shreeram-crm/ catch-all)
location ^~ /shreeram-crm/v3/ {
    alias /var/www/shreeram-crm/backend/public/app-v3/;
    index index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
}

