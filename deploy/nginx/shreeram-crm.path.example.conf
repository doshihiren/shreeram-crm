# Add these location blocks into the EXISTING aweliontech.com server { ... }.
# Do NOT replace unrelated site configs. Test with: sudo nginx -t
#
# Demo URL: https://aweliontech.com/shreeram-crm
# Laravel public: /var/www/shreeram-crm/backend/public
# Flutter web:    /var/www/shreeram-crm/backend/public/app
#
# Adjust fastcgi_pass socket: ls /run/php/

# --- API (Laravel) ---
location ^~ /shreeram-crm/api/ {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME /var/www/shreeram-crm/backend/public/index.php;
    fastcgi_param SCRIPT_NAME /shreeram-crm/index.php;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_param PATH_INFO $fastcgi_path_info;
}

# Fallback for /shreeram-crm/api without trailing path edge cases
location = /shreeram-crm/api {
    return 301 /shreeram-crm/api/;
}

# --- Flutter Web UI ---
location = /shreeram-crm {
    return 301 /shreeram-crm/;
}

location ^~ /shreeram-crm/ {
    alias /var/www/shreeram-crm/backend/public/app/;
    try_files $uri $uri/ /shreeram-crm/index.html;
}

# SPA index fallback
location = /shreeram-crm/index.html {
    alias /var/www/shreeram-crm/backend/public/app/index.html;
}
