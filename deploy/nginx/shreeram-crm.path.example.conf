# Add/replace ShreeRam blocks inside EXISTING aweliontech.com HTTPS server.
# Do NOT replace unrelated site configs. Test with: sudo nginx -t
#
# UI (cache-bust): https://aweliontech.com/shreeram-crm/v2/
# API:             https://aweliontech.com/shreeram-crm/api/v1/...
#
# PHP socket check: ls /run/php/

# --- API (Laravel) ---
location ^~ /shreeram-crm/api/ {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME /var/www/shreeram-crm/backend/public/index.php;
    fastcgi_param SCRIPT_NAME /shreeram-crm/index.php;
    fastcgi_param REQUEST_URI $request_uri;
}

location = /shreeram-crm/api {
    return 301 /shreeram-crm/api/;
}

# Old UI path -> new cache-bust path (escapes stale service worker)
location = /shreeram-crm {
    return 302 /shreeram-crm/v2/;
}
location = /shreeram-crm/ {
    return 302 /shreeram-crm/v2/;
}

# --- Flutter Web UI v2 ---
# Hash routing (#/...) so directory index is enough; no try_files needed.
location ^~ /shreeram-crm/v2/ {
    alias /var/www/shreeram-crm/backend/public/app-v2/;
    index index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
}
