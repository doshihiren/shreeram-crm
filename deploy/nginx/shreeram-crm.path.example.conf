# ShreeRam CRM — paste into HTTPS server block of aweliontech.com
# IMPORTANT: DELETE any older /shreeram-crm/ UI locations first.

# API
location ^~ /shreeram-crm/api/ {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME /var/www/shreeram-crm/backend/public/index.php;
    fastcgi_param SCRIPT_NAME /shreeram-crm/index.php;
    fastcgi_param REQUEST_URI $request_uri;
    add_header Cache-Control "no-store" always;
}

location = /shreeram-crm/api {
    return 301 /shreeram-crm/api/;
}

# Force old UI URLs to v3
location = /shreeram-crm {
    return 302 /shreeram-crm/v3/;
}
location = /shreeram-crm/ {
    return 302 /shreeram-crm/v3/;
}
location ^~ /shreeram-crm/v2/ {
    return 302 /shreeram-crm/v3/;
}

# Large JS bundle — long cache (URL is cache-busted with ?v=BUILD_ID)
location ^~ /shreeram-crm/v3/main.dart.js {
    alias /var/www/shreeram-crm/backend/public/app-v3/main.dart.js;
    default_type application/javascript;
    gzip on;
    gzip_comp_level 6;
    gzip_types application/javascript text/javascript application/json;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    access_log off;
}

# Flutter assets (fonts/images) — long cache
location ^~ /shreeram-crm/v3/assets/ {
    alias /var/www/shreeram-crm/backend/public/app-v3/assets/;
    gzip on;
    gzip_types application/javascript application/json text/css font/ttf font/otf;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    access_log off;
}

# HTML shell + bootstrap — short cache (must pick up new BUILD_ID quickly)
# NEVER use no-store here (it disables Cloudflare edge cache → multi-minute loads)
location ^~ /shreeram-crm/v3/ {
    alias /var/www/shreeram-crm/backend/public/app-v3/;
    index index.html;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        font/ttf
        font/otf
        image/svg+xml;
    add_header Cache-Control "public, max-age=60, must-revalidate" always;
}
